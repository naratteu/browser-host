name: Pages

on:
  push:
    branches: [main]
    paths: [portal/**, wiki/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: portal/go.mod
          cache-dependency-path: portal/go.sum
      - name: Build the WebAssembly connector
        working-directory: portal
        run: |
          GOOS=js GOARCH=wasm go build -trimpath -ldflags "-s -w" -o web/portal.wasm .
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/
      - name: Build the wiki serve connector
        working-directory: wiki/serve
        run: |
          GOOS=js GOARCH=wasm go build -buildvcs=false -trimpath -ldflags "-s -w" -o ../../portal/web/portal-serve.wasm .
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portal/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
